<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4F3066">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Forms · Parslia Kitchen OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --p:#4F3066;--d:#352044;--g:#C6A66F;--c:#F8F5FB;--paper:#FFFDF9;--line:#E4DCE8;--muted:#756B7D;--ink:#2B1E3A;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);--tap:52px;--radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--c);color:var(--ink);font:15px/1.45 Outfit,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;margin:0;color:var(--p)}
a{color:inherit}
.top{position:sticky;top:0;z-index:40;padding-top:var(--safe-t);background:linear-gradient(135deg,var(--d),var(--p));color:#fff;border-bottom:2px solid var(--g)}
.topin{max-width:920px;margin:auto;min-height:64px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:10px;object-fit:contain;background:#fff}
.brand{flex:1}.brand b{display:block;font-size:18px}.brand small{color:var(--g);font-size:11px;letter-spacing:.06em}
.top a.back{color:#fff;text-decoration:none;font-weight:600;font-size:13px;padding:8px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px}
.wrap{max-width:920px;margin:auto;padding:16px 14px calc(88px + var(--safe-b))}
.hero{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 8px 28px rgba(79,48,102,.06)}
.hero .eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(28px,5vw,40px);line-height:1;margin:6px 0 8px}
.hero p{margin:0;color:var(--muted);max-width:52ch}
.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 12px;scrollbar-width:none;position:sticky;top:66px;z-index:30;background:linear-gradient(var(--c),var(--c) 85%,transparent);margin:0 -2px;padding-left:2px;padding-right:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--p);font-weight:700;font-size:13px;cursor:pointer}
.chips button.on{background:var(--p);color:#fff;border-color:var(--p)}
.panel{display:none}.panel.on{display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{
  display:flex;flex-direction:column;gap:8px;min-height:118px;padding:16px;border-radius:var(--radius);
  background:#fff;border:1px solid var(--line);text-decoration:none;color:inherit;
  box-shadow:0 4px 16px rgba(79,48,102,.04);transition:transform .15s ease,box-shadow .15s ease;
}
.card:active{transform:scale(.98)}
.card .tag{font-size:11px;font-weight:700;color:var(--g);letter-spacing:.04em;text-transform:uppercase}
.card h3{font-size:22px;line-height:1.1}
.card p{margin:0;font-size:13px;color:var(--muted);flex:1}
.card .go{font-size:12px;font-weight:700;color:var(--p)}
.search{width:100%;min-height:var(--tap);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;background:#fff;margin-bottom:12px}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.bottom .in{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);height:70px}
.bottom a{text-decoration:none;color:var(--muted);display:grid;place-items:center;align-content:center;gap:2px;font-size:10px;font-weight:600}
.bottom a b{font-size:16px;font-weight:500}
.bottom a.active{color:var(--p)}
.card.hidden{display:none}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <img class="logo" src="kitchen-photos/vedanta-logo.png" alt="">
  <div class="brand"><b>Forms</b><small>PARSLIA · THE VEDĀNTA WAY</small></div>
  <a class="back" href="pro-dashboard.html">Dashboard</a>
</div></header>

<main class="wrap">
  <div class="hero">
    <div class="eyebrow">Kitchen records</div>
    <h1>Pick a form. Fill. Save.</h1>
    <p>No endless scrolling — choose a category, tap one form, work only on that form.</p>
  </div>

  <input class="search" id="q" type="search" placeholder="Search forms…" inputmode="search" autocomplete="off">

  <div class="chips" role="tablist" aria-label="Form categories">
    <button type="button" class="on" data-cat="all" role="tab" aria-selected="true">All</button>
    <button type="button" data-cat="quick" role="tab">Quick checks</button>
    <button type="button" data-cat="competency" role="tab">Competency</button>
    <button type="button" data-cat="working" role="tab">Working records</button>
    <button type="button" data-cat="safety" role="tab">Safety</button>
    <button type="button" data-cat="equipment" role="tab">Equipment</button>
    <button type="button" data-cat="stores" role="tab">Stores</button>
    <button type="button" data-cat="chemicals" role="tab">Chemicals</button>
    <button type="button" data-cat="kp" role="tab">KP / Procedures</button>
    <button type="button" data-cat="suppliers" role="tab">Suppliers</button>
  </div>

  <div class="grid" id="grid"></div>
  <p class="hint" id="empty" hidden>No forms match that search.</p>
</main>

<nav class="bottom" aria-label="Primary">
  <div class="in">
    <a href="pro-dashboard.html"><b>⌂</b>Home</a>
    <a href="my-activity.html"><b>✓</b>Today</a>
    <a class="active" href="forms-hub.html"><b>☰</b>Forms</a>
    <a href="staff-tree.html"><b>◎</b>Team</a>
    <a href="kitchen-sop-pack.html"><b>⋯</b>More</a>
  </div>
</nav>

<script>
(function () {
  var FORMS = [
    { cat:'quick', title:'Temperature check', blurb:'Fridge, freezer, cook, hot hold — traffic-light result.', href:'smart-forms.html?task=temp', tag:'Smart' },
    { cat:'quick', title:'Cleaning sign-off', blurb:'Area checklist and save for the shift.', href:'smart-forms.html?task=clean', tag:'Smart' },
    { cat:'quick', title:'Delivery check', blurb:'Supplier, temp, condition on arrival.', href:'smart-forms.html?task=delivery', tag:'Smart' },
    { cat:'quick', title:'Risk review', blurb:'Quick hazard status and action note.', href:'smart-forms.html?task=risk', tag:'Smart' },
    { cat:'competency', title:'Competency hub', blurb:'Sign-off sheets for kit and skills.', href:'kitchen-sop-pack.html?focus=COMPETENCY-QUICK#COMPETENCY-QUICK', tag:'SOP' },
    { cat:'competency', title:'Robot-Coupe competency', blurb:'R502 supervised sign-off.', href:'kitchen-sop-pack.html?focus=COMPETENCY-QUICK#COMPETENCY-QUICK', tag:'SOP' },
    { cat:'competency', title:'Thermomix competency', blurb:'TM6 supervised sign-off.', href:'kitchen-sop-pack.html?focus=COMPETENCY-QUICK#COMPETENCY-QUICK', tag:'SOP' },
    { cat:'working', title:'Reusable kitchen forms', blurb:'K001–K025 — pick one form, one entry.', href:'kitchen-sop-pack.html?focus=working-forms#working-forms', tag:'SOP' },
    { cat:'working', title:'Shift log', blurb:'Start / finish / handovers.', href:'kitchen-sop-pack.html?focus=working-forms#working-forms', tag:'SOP' },
    { cat:'safety', title:'Safety First', blurb:'HSE materials and safety chapter.', href:'kitchen-sop-pack.html?focus=safety#safety', tag:'SOP' },
    { cat:'safety', title:'Knife & mandoline', blurb:'Safe use and injury response.', href:'kitchen-sop-pack.html?focus=safety#safety', tag:'SOP' },
    { cat:'equipment', title:'Equipment SOPs', blurb:'Point-of-work sheets and films.', href:'equipment.html', tag:'App' },
    { cat:'equipment', title:'Cleaning SOP strip', blurb:'House clean / look after / maintain.', href:'cleaning-sop.html', tag:'App' },
    { cat:'stores', title:'Stores forms', blurb:'Receiving and stock records in the pack.', href:'kitchen-sop-pack.html?focus=working-forms#working-forms', tag:'SOP' },
    { cat:'chemicals', title:'Chemicals', blurb:'COSHH / chemical use records.', href:'kitchen-sop-pack.html?focus=chemicals#chemicals', tag:'SOP' },
    { cat:'kp', title:'KP procedures', blurb:'Kitchen porter procedures.', href:'kitchen-sop-pack.html?focus=working-forms#working-forms', tag:'SOP' },
    { cat:'suppliers', title:'Suppliers', blurb:'Approved supplier references.', href:'kitchen-sop-pack.html?focus=working-forms#working-forms', tag:'SOP' }
  ];

  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var cat = 'all';
  var q = '';

  function render() {
    var n = 0;
    grid.innerHTML = '';
    FORMS.forEach(function (f) {
      if (cat !== 'all' && f.cat !== cat) return;
      var hay = (f.title + ' ' + f.blurb + ' ' + f.tag + ' ' + f.cat).toLowerCase();
      if (q && hay.indexOf(q) === -1) return;
      n++;
      var a = document.createElement('a');
      a.className = 'card';
      a.href = f.href;
      a.innerHTML = '<span class="tag">' + f.tag + ' · ' + f.cat + '</span><h3>' + f.title + '</h3><p>' + f.blurb + '</p><span class="go">Open →</span>';
      grid.appendChild(a);
    });
    empty.hidden = n > 0;
  }

  document.querySelectorAll('.chips button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      cat = btn.getAttribute('data-cat');
      document.querySelectorAll('.chips button').forEach(function (b) {
        var on = b === btn;
        b.classList.toggle('on', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      render();
    });
  });
  document.getElementById('q').addEventListener('input', function (e) {
    q = (e.target.value || '').trim().toLowerCase();
    render();
  });
  render();
})();
</script>
</body>
</html>
