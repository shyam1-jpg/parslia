<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print SOP · Parslia</title><style>:root{--g:#17382f;--gold:#c6a66f;--line:#d8d0c4;--paper:#fff}*{box-sizing:border-box}body{margin:0;background:#eee7da;color:#1d1a16;font:14px/1.45 Arial,sans-serif}.bar{position:sticky;top:0;z-index:10;background:#17382f;color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center}.bar b{flex:1}.bar button,.bar a{border:1px solid #ffffff55;background:#fff;color:#17382f;padding:9px 13px;border-radius:9px;text-decoration:none;font-weight:700;cursor:pointer}.page{width:min(900px,calc(100% - 24px));margin:18px auto;background:#fff;padding:28px 32px;box-shadow:0 8px 28px #0001}.head{border-bottom:3px solid var(--g);padding-bottom:12px;margin-bottom:18px}.head small{color:#6d655c;letter-spacing:.1em}.head h1{font:600 30px Georgia,serif;color:var(--g);margin:5px 0}.source>*{max-width:100%}.source img,.source video{max-width:100%;height:auto}.source nav,.source .chapter-rail,.source .hero-cta,.source button,.source .visual-controls,.source .book-nav{display:none!important}.source .card,.source .sheet,.source details{box-shadow:none!important;border:1px solid var(--line)!important;background:#fff!important;padding:14px!important;margin:12px 0!important}.source table{width:100%;border-collapse:collapse}.source th,.source td{border:1px solid #ccc;padding:6px}.source input,.source select,.source textarea{border:1px solid #bbb;padding:5px}.note{padding:12px;border:1px solid var(--gold);background:#fff8e9;border-radius:10px;margin-bottom:15px}@media print{@page{size:A4;margin:12mm}.bar,.note{display:none!important}body{background:#fff}.page{width:auto;margin:0;padding:0;box-shadow:none}.source .card,.source .sheet,.source details{break-inside:avoid;page-break-inside:avoid}.source img{max-height:220mm;object-fit:contain}a{color:#000;text-decoration:none}.head{break-after:avoid}}</style></head><body><div class="bar"><b>Parslia · Single-section print</b><a href="kitchen-sop-pack.html">Back</a><button onclick="window.print()">Print this section</button></div><main class="page"><div class="note">This print view prints only the selected SOP/section instead of the complete SOP pack.</div><header class="head"><small>PARSLIA · THE VEDĀNTA</small><h1 id="title">Preparing print view…</h1><div id="meta"></div></header><div id="out" class="source"></div></main><script>(async()=>{const p=new URLSearchParams(location.search);const id=(p.get('id')||location.hash.slice(1)||'equipment').replace(/[^A-Za-z0-9_-]/g,'');try{const r=await fetch('kitchen-sop-pack.html',{cache:'no-store'});const text=await r.text();const doc=new DOMParser().parseFromString(text,'text/html');let el=doc.getElementById(id);if(!el){document.getElementById('title').textContent='Section not found';document.getElementById('out').innerHTML='<p>Return to the SOP pack and choose a section to print.</p>';return}let target=el;if(['A','SPAN','BUTTON'].includes(el.tagName)&&el.parentElement)target=el.parentElement;const h=target.querySelector('h1,h2,h3')||target.closest('.card,.sheet')?.querySelector('h1,h2,h3');document.getElementById('title').textContent=h?h.textContent.trim():id.replace(/-/g,' ');document.getElementById('meta').textContent='Section '+id+' · Printed '+new Date().toLocaleDateString('en-GB');const clone=target.cloneNode(true);clone.querySelectorAll('script,style,nav,.chapter-rail,.hero-cta,.visual-controls,.book-nav').forEach(x=>x.remove());document.getElementById('out').appendChild(clone)}catch(e){document.getElementById('title').textContent='Unable to prepare print view';document.getElementById('out').textContent=e.message}})();</script></body></html>
