<script>
(async()=>{
 const requestedHash=location.hash;
 try{
  const r=await fetch('kitchen-sop-pack-legacy.html'+location.search,{cache:'no-store'});
  if(!r.ok) throw new Error('Unable to load SOP pack');
  let h=await r.text();
  const css=`

header.site-hero{display:none!important}
.ps-page-intro{max-width:var(--wrap);margin:0 auto;padding:25px 18px 5px}.ps-page-intro .kicker{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8b6a34}.ps-page-intro h1{font-family:'Cormorant Garamond',Georgia,serif!important;font-weight:600!important;font-size:clamp(31px,4vw,45px)!important;line-height:1!important;color:var(--forest)!important;margin:7px 0 9px!important;max-width:none!important}.ps-page-intro p{margin:0;color:var(--ink2);max-width:72ch;font-size:14px}.ps-page-intro .quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.ps-page-intro .quick a{display:inline-flex;align-items:center;min-height:40px;padding:8px 12px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--forest);text-decoration:none;font-size:12px;font-weight:700}.ps-page-intro .quick a.main{background:var(--forest);color:#fff;border-color:var(--forest)}
.wrap{max-width:var(--wrap)!important;padding:10px 18px 108px!important}.chapter-rail{top:66px!important;margin:0 -18px 13px!important;padding:8px 18px!important;background:rgba(248,243,233,.96)!important;backdrop-filter:blur(16px)!important;border-bottom:1px solid var(--line)!important;box-shadow:0 5px 18px rgba(20,45,38,.045)!important}.chapter-rail nav,.chapter-nav{flex-wrap:nowrap!important;overflow-x:auto!important;scrollbar-width:none!important}.chapter-rail nav::-webkit-scrollbar,.chapter-nav::-webkit-scrollbar{display:none}.chapter-rail a,.chapter-nav a{flex:0 0 auto!important;white-space:nowrap!important;border-radius:999px!important;padding:8px 12px!important;min-height:38px!important;font-size:12px!important;box-shadow:none!important;background:#fff!important;border:1px solid var(--line)!important;color:var(--forest)!important}.chapter-rail a:hover,.chapter-nav a:hover{border-color:var(--gold)!important;background:#fffaf1!important}

table{background:#fff!important}th{background:#f1eadf!important;color:var(--forest)!important;font-size:12px!important}th,td{padding:9px 8px!important}table{display:block!important;overflow-x:auto!important;border-radius:12px!important}.book-nav{border-radius:18px!important;border-top:3px solid var(--gold)!important}.status{border-radius:999px!important;padding:4px 8px!important;font-size:11px!important}
#working-forms,#shift-plan,#record,[id^='KP-'],[id^='K0'],[id^='P0']{scroll-margin-top:126px!important}#working-forms h2,#shift-plan h2{font-size:27px!important}.m{color:var(--ink2)!important;font-size:13px!important}.callbtn{border-radius:11px!important;min-height:44px!important;padding:11px 14px!important}.equip-grid{gap:12px!important}.task-audit{padding-top:8px!important;margin-top:9px!important}
@media(max-width:820px){#parslia-shell .ps-inner{align-items:flex-start;flex-wrap:wrap;padding:9px 12px}#parslia-shell nav{width:100%}#parslia-shell .ps-brand strong{font-size:18px}.chapter-rail{top:105px!important}.shift-grid{grid-template-columns:1fr!important}.wrap{padding:8px 10px 100px!important}.ps-page-intro{padding:19px 12px 3px}.chapter-rail{margin:0 -10px 10px!important;padding:7px 10px!important}.card,.sheet,details.card{padding:15px!important;border-radius:15px!important}.sheet>ol>li,.sheet-main>ol>li{padding-left:42px!important}.sheet-layout.has-media{grid-template-columns:1fr!important}.visual-steps{grid-template-columns:1fr 1fr!important}}
@media(max-width:520px){body{font-size:14px!important}#parslia-shell .ps-mark{width:38px;height:38px}.ps-page-intro h1{font-size:30px!important}.ps-page-intro p{font-size:13px}.wrap{padding-left:8px!important;padding-right:8px!important}.chapter-rail{margin-left:-8px!important;margin-right:-8px!important;padding-left:8px!important;padding-right:8px!important}.card,.sheet,details.card{padding:13px!important}.visual-steps{grid-template-columns:1fr!important}.sheet>ol>li,.sheet-main>ol>li{padding-left:38px!important}.row button,.row .btn{flex:1 1 140px!important}}
@media print{#parslia-shell,.ps-page-intro,.chapter-rail{display:none!important}body{background:#fff!important}.card,.sheet{box-shadow:none!important;border-color:#ccc!important}}
`;
  const shell=`<header id="parslia-shell"><div class="ps-inner"><div class="ps-mark" aria-label="Parslia">V</div><div class="ps-brand"><strong>Kitchen Ops · The Vedānta</strong><small>PARSLIA PROFESSIONAL OPERATIONS SYSTEM</small></div><nav aria-label="Primary"><a href="/">Home</a><a href="/pro-dashboard.html">Command Centre</a><a href="#working-forms">Forms</a><a href="#shift-plan">Daily Log</a><a href="#record">Training</a><a class="primary" href="#KP-18">SOP Library</a></nav></div></header><section class="ps-page-intro"><div class="kicker">Standard Operating Procedures</div><h1>Kitchen Operations & SOP Library</h1><p>Approved procedures, working forms, food-safety records, visual guidance and training evidence in one operational system.</p><div class="quick"><a class="main" href="#KP-18">Browse SOPs</a><a href="#working-forms">Kitchen forms</a><a href="#shift-plan">Daily work log</a><a href="#record">Training records</a></div></section>`;
  h=h.replace('</head>',`<style id="parslia-pro-overrides">${css}</style></head>`);
  h=h.replace(/<body([^>]*)>/i,`<body$1>${shell}`);
  document.open();document.write(h);document.close();
  if(requestedHash){setTimeout(()=>{const el=document.getElementById(requestedHash.slice(1));if(el)el.scrollIntoView({block:'start'})},120)}
 }catch(e){document.body.innerHTML='<div class="loading"><div><b>Unable to open SOP system</b><p>'+e.message+'</p><p><a href="kitchen-sop-pack-legacy.html'+location.hash+'">Open legacy SOP pack</a></p></div></div>'}
})();
</script>
