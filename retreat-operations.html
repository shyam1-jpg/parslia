x;bottom:0}.four{left:82px;bottom:0}.five{left:55px;top:67px}.one .num{background:#3d7643}.two .num{background:#397ca3}.three .num{background:#a67638}.four .num{background:#3f8b80}.five .num{background:#b7475d}.motto{text-align:center;font-size:10px;font-weight:800;letter-spacing:.15em;margin:3px 0 22px;color:#333}.motto span{display:block;color:#777;font-size:8px;font-weight:600;letter-spacing:.11em;margin-top:4px}.manager{max-width:700px;margin:auto;border-top:1px solid #ddd;padding-top:18px;text-align:center}.manager h2{font:700 24px Georgia,serif;margin:0 0 6px}.manager p{font-size:11.5px;line-height:1.5;color:#555;margin:0 auto 15px;max-width:650px}.flow{display:grid;justify-items:center;gap:3px}.flow span{font-size:10px}.flow .box{border:1px solid #ddd;border-radius:8px;background:#fcfbf8;padding:6px 12px;min-width:215px;font-weight:700}.flow .arr{color:#aaa}.teams{font-size:9px!important;color:#666}.vedanta-mark{text-align:center;margin-top:18px;color:#4F3066;font:600 13px Georgia,serif}.vedanta-mark small{display:block;font:700 8px system-ui;color:#C6A66F;letter-spacing:.16em;margin-top:3px}@media(max-width:760px){.sheet{padding:18px 8px}.art{width:100%;height:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.ring,.leaf{display:none}.circle,.core,.one,.two,.three,.four,.five{position:relative;inset:auto;transform:none;width:min(42vw,175px);height:auto;aspect-ratio:1;margin:auto}.core{grid-column:1/-1;grid-row:1}.manager{margin-top:20px}}@media(max-width:430px){.art{grid-template-columns:1fr}.core{grid-column:auto}.circle,.core{width:min(62vw,190px)}}</style></head><body class="parslia-shell"><script src="js/parslia-shell.js"></script><script>const content=`<div class="sheet"><header class="head"><h1>Different Teams. A Shared Purpose.</h1><p>Supporting Extraordinary Retreats Together</p></header><section class="art"><div class="ring"></div><i class="leaf l1"></i><i class="leaf l2"></i><i class="leaf l3"></i><i class="leaf l4"></i><article class="circle one"><b class="num">1</b><div><h2>Restaurant & Kitchen</h2><p>To be fed and watered.</p></div></article><article class="circle two"><b class="num">2</b><div><h2>Housekeeping</h2><p>To have a clean space to sleep and carry out their activities.</p></div></article><article class="circle three"><b class="num">3</b><div><h2>Estate Management</h2><p>To have the right equipment in the right space.</p></div></article><article class="circle four"><b class="num">4</b><div><h2>Housekeeping & Estate Management</h2><p>To have access to a functioning spa with towels.</p></div></article><article class="circle five"><b class="num">5</b><div><h2>Guest Services</h2><p>To be welcomed and cared for.</p></div></article><article class="circle core"><div><h2>Our Client & Their Guests</h2></div></article></section><div class="motto">DIFFERENT TEAMS · A SHARED PURPOSE<span>SUPPORTING EXTRAORDINARY RETREATS TOGETHER</span></div><section class="manager"><h2>The Retreat Manager</h2><p>The Retreat Manager is the bridge between the client and our operational teams — understanding the individual needs of each retreat, turning those needs into clear actions, and bringing the right people together to ensure everything is delivered smoothly.</p><div class="flow"><span class="box">Client & Guests</span><span class="arr">↓</span><span class="box">Retreat Manager — understands the whole picture</span><span class="arr">↓</span><span class="box">Coordinates the right teams</span><span class="arr">↓</span><span class="teams">Restaurant & Kitchen · Housekeeping · Estate Management · Guest Services</span><span class="arr">↓</span><span class="box">Each team delivers its area of responsibility</span><span class="arr">↓</span><span class="box">A smooth, well-supported retreat experience</span></div></section><div class="vedanta-mark">The Vedānta Way<small>PARSLIA.net</small></div></div>`;ParsliaShell.wrap(content);</script></body></html>
