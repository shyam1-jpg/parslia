<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4F3066"><title>Equipment · Parslia</title><style>:root{--p:#4F3066;--pd:#352044;--gold:#C6A66F;--bg:#F7F3F9;--line:#E5DCE9;--muted:#756B7D;--green:#2f6b4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 system-ui,sans-serif;color:#2B1E3A}.top{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:10}.topin{max-width:1180px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}.brand{flex:1}.brand b{display:block;font:600 21px Georgia}.brand small{color:var(--gold)}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff40;padding:8px 11px;border-radius:10px}.wrap{max-width:1180px;margin:auto;padding:22px 16px 80px}.hero{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 30px #4f306610}.hero small{color:var(--gold);font-weight:800;letter-spacing:.12em}.hero h1{font:700 40px/1 Georgia;color:var(--p);margin:6px 0}.hero p{margin:0;color:var(--muted)}.tools{display:flex;gap:9px;margin:14px 0;flex-wrap:wrap}.search{flex:1;min-width:220px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 7px 22px #4f30660c}.photo{height:210px;background:#eee;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:15px}.row{display:flex;align-items:flex-start;gap:8px}.row h2{flex:1;margin:0;color:var(--p);font:700 22px Georgia}.status{background:#e7f3eb;color:var(--green);font-size:10px;font-weight:800;padding:5px 8px;border-radius:999px}.meta{color:var(--muted);font-size:12px;margin-top:3px}.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:13px}.actions a{border:1px solid var(--line);border-radius:9px;text-decoration:none;color:var(--p);padding:8px 3px;text-align:center;font-size:10px;font-weight:700}.actions a:hover{background:#F2ECF5}.empty{display:none;padding:30px;text-align:center;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}.photo{height:230px}.hero h1{font-size:32px}.actions{grid-template-columns:repeat(3,1fr)}}</style></head><body><header class="top"><div class="topin"><img class="logo" src="kitchen-photos/vedanta-logo.png" alt="The Vedanta"><div class="brand"><b>Kitchen Equipment</b><small>PARSLIA · THE VEDANTA WAY</small></div><a href="pro-dashboard.html">Dashboard</a></div></header><main class="wrap"><section class="hero"><small>EQUIPMENT PASSPORTS</small><h1>Kitchen Equipment</h1><p>Your real Vedanta equipment in one place. Open SOPs, cleaning, training, videos and fault reporting from each machine.</p></section><div class="tools"><input id="search" class="search" type="search" placeholder="Search equipment…"></div><section id="grid" class="grid"></section><div id="empty" class="empty">No equipment matches your search.</div></main><script>const items=[{name:'Electrolux Bratt Pan',brand:'Electrolux',img:'kitchen-photos/eq-electrolux-bratt-pan.jpg',q:'bratt'},{name:'Rational Oven',brand:'Rational',img:'kitchen-photos/clean-eq-rational.jpg',q:'rational'},{name:'Blast Chiller',brand:'Foster',img:'kitchen-photos/eq-foster-blast-chiller.jpg',q:'blast'},{name:'Buffalo Induction',brand:'Buffalo',img:'kitchen-photos/eq-buffalo-induction.jpg',q:'induction'},{name:'Thermomix',brand:'Vorwerk',img:'kitchen-photos/clean-eq-thermomix.jpg',q:'thermomix'},{name:'Deep Fat Fryer',brand:'Lincat',img:'kitchen-photos/clean-eq-lincat-fryer.jpg',q:'fryer'}];const grid=document.getElementById('grid'),empty=document.getElementById('empty');function card(x){return `<article class="card" data-name="${(x.name+' '+x.brand).toLowerCase()}"><div class="photo"><img loading="lazy" src="${x.img}" alt="${x.name}"></div><div class="body"><div class="row"><h2>${x.name}</h2><span class="status">Operational</span></div><div class="meta">${x.brand} · Vedanta kitchen</div><div class="actions"><a href="kitchen-sop-pack.html#EQUIPMENT">SOP</a><a href="cleaning-sop.html">Cleaning</a><a href="kitchen-sop-pack.html#COMPETENCY-QUICK">Training</a><a href="kitchen-videos/">Video</a><a href="kitchen-sop-pack.html#record">Report</a></div></div></article>`}grid.innerHTML=items.map(card).join('');document.getElementById('search').addEventListener('input',e=>{let q=e.target.value.toLowerCase().trim(),n=0;document.querySelectorAll('.card').forEach(c=>{let show=!q||c.dataset.name.includes(q);c.style.display=show?'':'none';if(show)n++});empty.style.display=n?'none':'block'});</script></body></html>
